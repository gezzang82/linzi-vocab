<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TITLE_PLACEHOLDER</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Noto Sans KR',sans-serif;background:#f0f4ff;min-height:100vh;overflow-x:hidden}
.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex}

/* ── 홈 ── */
#screen-home{background:linear-gradient(160deg,#4f46e5,#7c3aed);color:white;align-items:center;padding:44px 24px 40px;gap:20px;overflow-y:auto}
.home-logo{font-size:2.8rem}
.home-title{font-size:1.6rem;font-weight:900;letter-spacing:-.5px}
.home-date{font-size:.8rem;opacity:.7}
.streak-row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.15);border-radius:99px;padding:10px 24px}
.streak-fire{font-size:1.5rem}
.streak-num{font-size:1.8rem;font-weight:900}
.streak-label{font-size:.8rem;opacity:.8}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.stat-card{background:rgba(255,255,255,.15);border-radius:18px;padding:18px;text-align:center}
.stat-card .val{font-size:2rem;font-weight:900}
.stat-card .lbl{font-size:.75rem;opacity:.75;margin-top:3px}
.btn-start{background:white;color:#4f46e5;border:none;border-radius:99px;padding:16px;font-size:1.1rem;font-weight:800;cursor:pointer;width:100%;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.btn-start:active{transform:scale(.98)}
.btn-quiz-only{background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.4);color:white;border-radius:99px;padding:13px;font-size:.95rem;font-weight:600;cursor:pointer;width:100%}
.btn-quiz-only:active{transform:scale(.98)}
.home-stats-history{background:rgba(255,255,255,.12);border-radius:18px;padding:14px 16px;width:100%}
.hsh-title{font-size:.75rem;opacity:.6;margin-bottom:10px;font-weight:600;letter-spacing:.5px}
.hsh-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0}
.hsh-row+.hsh-row{border-top:1px solid rgba(255,255,255,.1)}
.hsh-lbl{font-size:.82rem;opacity:.8}
.hsh-val{font-size:.9rem;font-weight:700}
.weak-words{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.weak-tag{background:rgba(255,255,255,.15);border-radius:99px;padding:3px 10px;font-size:.75rem}
.save-status{font-size:.72rem;opacity:.5;text-align:center}

/* ── 카드 ── */
#screen-card{background:#f0f4ff}
.card-header{background:white;padding:14px 16px 0;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.lang-tabs{display:flex;gap:0;background:#f0f4ff;border-radius:12px;padding:4px;margin-bottom:12px}
.lang-tab{flex:1;padding:8px 4px;font-size:.85rem;font-weight:600;border:none;background:transparent;color:#6b7280;border-radius:8px;cursor:pointer;transition:all .2s}
.lang-tab.active{background:#4f46e5;color:white}
.card-prog-wrap{height:4px;background:#e5e7eb;margin:0 -16px}
.card-prog-bar{height:4px;background:#4f46e5;transition:width .3s}
.card-counter{text-align:center;font-size:.82rem;color:#6b7280;padding:10px 0 4px}
.card-area{flex:1;display:flex;align-items:center;justify-content:center;padding:12px 20px}
.flashcard{width:100%;max-width:420px;height:300px;perspective:1200px;cursor:pointer}
.flashcard-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg)}
.card-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-shadow:0 6px 24px rgba(79,70,229,.12);background:white}
.card-back{transform:rotateY(180deg)}
.card-pos{background:#e0e7ff;color:#4338ca;padding:3px 12px;border-radius:99px;font-size:.78rem;font-weight:600;margin-bottom:10px}
.card-word{font-size:2.1rem;font-weight:900;color:#1e1b4b;text-align:center}
.card-pron{font-size:.85rem;color:#6b7280;margin-top:4px}
.card-meaning{font-size:1.35rem;font-weight:700;color:#1e1b4b;text-align:center;line-height:1.4}
.card-example{font-size:.8rem;color:#4b5563;background:#f9fafb;border-radius:12px;padding:9px 13px;margin-top:10px;line-height:1.6;text-align:center;width:100%}
.card-tip{font-size:.77rem;color:#d97706;margin-top:6px;text-align:center}
.card-hint{font-size:.82rem;color:#9ca3af;margin-top:14px}
.tts-row{display:flex;align-items:center;gap:6px;margin-top:4px}
.tts-btn{background:none;border:none;cursor:pointer;font-size:.95rem;padding:3px 7px;border-radius:8px}
.tts-btn:active{background:#e0e7ff}
.card-nav{display:flex;align-items:center;gap:10px;padding:10px 16px 28px}
.btn-nav{flex:1;background:white;border:2px solid #e5e7eb;color:#374151;border-radius:16px;padding:14px;font-size:.95rem;font-weight:600;cursor:pointer;transition:border-color .2s}
.btn-nav:hover{border-color:#4f46e5;color:#4f46e5}
.btn-nav:disabled{opacity:.3;cursor:default;border-color:#e5e7eb;color:#9ca3af}
.btn-to-quiz{flex:2;background:#4f46e5;color:white;border:none;border-radius:16px;padding:14px;font-size:1rem;font-weight:700;cursor:pointer;display:none}
.btn-to-quiz.show{display:block}

/* ── 퀴즈 공통 ── */
#screen-quiz{background:#f0f4ff}
.quiz-header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:white;padding:16px 20px}
.quiz-phase-label{font-size:.78rem;opacity:.75;margin-bottom:2px}
.quiz-phase-title{font-size:1.05rem;font-weight:700}
.quiz-prog-wrap{background:rgba(255,255,255,.25);border-radius:99px;height:5px;margin-top:10px}
.quiz-prog-bar{background:white;border-radius:99px;height:5px;transition:width .4s}
.quiz-body{flex:1;padding:16px;overflow-y:auto}
.quiz-qnum{font-size:.78rem;color:#6b7280;margin-bottom:8px;font-weight:600}
.quiz-q-card{background:white;border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.quiz-q-desc{font-size:.82rem;color:#6b7280;font-weight:600;margin-bottom:8px}
.quiz-q-main{font-size:1.25rem;font-weight:800;color:#1e1b4b;text-align:center;line-height:1.4}
.quiz-q-sub{font-size:.85rem;color:#6b7280;text-align:center;margin-top:4px}

/* 객관식 옵션 - 폰트 키움 */
.quiz-opts{display:flex;flex-direction:column;gap:10px}
.quiz-opt{background:white;border:2px solid #e5e7eb;border-radius:14px;padding:14px 16px;font-size:1rem;cursor:pointer;text-align:left;color:#374151;transition:all .15s;line-height:1.5;font-weight:500}
.quiz-opt:hover:not(:disabled){border-color:#4f46e5;background:#eef2ff}
.quiz-opt.correct{background:#d1fae5;border-color:#10b981;color:#065f46;font-weight:600}
.quiz-opt.wrong{background:#fee2e2;border-color:#ef4444;color:#991b1b}
.quiz-opt:disabled{cursor:default}
.quiz-feedback{text-align:center;font-size:.95rem;font-weight:600;min-height:22px;margin-top:12px}
.quiz-feedback.ok{color:#10b981}
.quiz-feedback.fail{color:#ef4444}
.btn-next-q{width:100%;background:#4f46e5;color:white;border:none;border-radius:16px;padding:15px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:14px;display:none}

/* ── 영작 퀴즈 ── */
.writing-area{display:flex;flex-direction:column;gap:10px}
.writing-label{font-size:.82rem;color:#6b7280;font-weight:600}
.writing-input{width:100%;background:white;border:2px solid #e5e7eb;border-radius:14px;padding:14px 16px;font-size:1rem;color:#1e1b4b;resize:none;min-height:80px;font-family:inherit;line-height:1.6;outline:none}
.writing-input:focus{border-color:#4f46e5}
.writing-btns{display:flex;gap:10px}
.btn-voice{flex:1;background:white;border:2px solid #e5e7eb;color:#374151;border-radius:14px;padding:13px;font-size:.95rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-voice.listening{background:#fee2e2;border-color:#ef4444;color:#ef4444}
.btn-submit{flex:2;background:#4f46e5;color:white;border:none;border-radius:14px;padding:13px;font-size:1rem;font-weight:700;cursor:pointer}
.btn-submit:disabled{opacity:.5;cursor:default}
.writing-result{background:white;border-radius:16px;padding:16px;margin-top:4px;display:none}
.writing-result.show{display:block}
.result-verdict{font-size:1.1rem;font-weight:700;margin-bottom:10px}
.result-verdict.ok{color:#10b981}
.result-verdict.fail{color:#ef4444}
.result-ref-label{font-size:.78rem;color:#6b7280;font-weight:600;margin-bottom:4px}
.result-ref{font-size:.9rem;color:#374151;line-height:1.6;background:#f9fafb;border-radius:10px;padding:10px 12px}
.result-ref em{color:#4f46e5;font-style:normal;font-weight:700}

/* ── 단계 전환 ── */
#screen-phase{background:linear-gradient(160deg,#4f46e5,#7c3aed);color:white;align-items:center;justify-content:center;padding:32px 24px;gap:20px}
.phase-icon{font-size:3.5rem}
.phase-title{font-size:1.5rem;font-weight:900;text-align:center}
.phase-desc{font-size:.9rem;opacity:.8;text-align:center;line-height:1.6}
.phase-score-box{background:rgba(255,255,255,.15);border-radius:16px;padding:14px 32px;text-align:center}
.phase-score-box .sc{font-size:2rem;font-weight:900}
.phase-score-box .sl{font-size:.8rem;opacity:.8}
.btn-next-phase{background:white;color:#4f46e5;border:none;border-radius:99px;padding:14px 40px;font-size:1rem;font-weight:800;cursor:pointer}

/* ── 완료 ── */
#screen-done{background:linear-gradient(160deg,#4f46e5,#7c3aed);color:white;align-items:center;padding:40px 24px;gap:16px;overflow-y:auto}
.done-emoji{font-size:3.5rem}
.done-title{font-size:1.6rem;font-weight:900}
.done-total{font-size:2.5rem;font-weight:900}
.done-breakdown{background:rgba(255,255,255,.15);border-radius:20px;padding:16px;width:100%}
.phase-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.phase-row+.phase-row{border-top:1px solid rgba(255,255,255,.15)}
.phase-row .pl{font-size:.85rem;opacity:.85}
.phase-row .pv{font-size:1rem;font-weight:700}
.wrong-list{width:100%}
.wrong-list h3{font-size:.85rem;opacity:.75;margin-bottom:10px}
.wrong-item{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.wrong-item .ww{font-weight:700;font-size:.95rem}
.wrong-item .wm{font-size:.8rem;opacity:.7;margin-top:2px}
.btn-retry{background:white;color:#4f46e5;border:none;border-radius:99px;padding:14px 40px;font-size:1rem;font-weight:800;cursor:pointer}
.done-note{font-size:.75rem;opacity:.6;text-align:center;padding:0 8px}
</style>
</head>
<body>

<!-- ── 홈 ── -->
<div class="screen active" id="screen-home">
  <div class="home-logo">📚</div>
  <div class="home-title">린지단어장</div>
  <div class="home-date" id="home-date"></div>
  <div class="streak-row">
    <span class="streak-fire">🔥</span>
    <span class="streak-num" id="streak-num">0</span>
    <span class="streak-label">일 연속 학습</span>
  </div>
  <div class="stats-grid">
    <div class="stat-card">
      <div class="val">NEW_WORDS_PLACEHOLDER</div>
      <div class="lbl">오늘 단어</div>
    </div>
    <div class="stat-card">
      <div class="val" id="stat-review">0</div>
      <div class="lbl">복습 대기</div>
    </div>
  </div>
  <button class="btn-start" onclick="startStudy()">단어 학습 시작 →</button>
  <button class="btn-quiz-only" onclick="startQuizOnly()">⚡ 퀴즈 바로 시작</button>
  <div class="home-stats-history" id="home-stats-history" style="display:none">
    <div class="hsh-title">📊 MY STATS</div>
    <div class="hsh-row">
      <span class="hsh-lbl">누적 학습일</span>
      <span class="hsh-val" id="hsh-total-days">-</span>
    </div>
    <div class="hsh-row">
      <span class="hsh-lbl">최근 7일 정확도</span>
      <span class="hsh-val" id="hsh-accuracy">-</span>
    </div>
    <div class="hsh-row">
      <span class="hsh-lbl">총 퀴즈 횟수</span>
      <span class="hsh-val" id="hsh-total-quiz">-</span>
    </div>
    <div class="hsh-row" id="hsh-weak-row" style="display:none">
      <span class="hsh-lbl">자주 틀리는 단어</span>
      <div class="weak-words" id="hsh-weak-words"></div>
    </div>
  </div>
  <div class="save-status" id="save-status"></div>
</div>

<!-- ── 카드 ── -->
<div class="screen" id="screen-card">
  <div class="card-header">
    <div class="lang-tabs">
      <button class="lang-tab active" id="tab-ko" onclick="setLang('ko')">🇰🇷 한국어 → 영어</button>
      <button class="lang-tab" id="tab-en" onclick="setLang('en')">🇺🇸 영어 → 한국어</button>
    </div>
    <div class="card-prog-wrap"><div class="card-prog-bar" id="card-prog"></div></div>
  </div>
  <div class="card-counter" id="card-counter"></div>
  <div class="card-area">
    <div class="flashcard" id="flashcard" onclick="flipCard()">
      <div class="flashcard-inner">
        <div class="card-face" id="card-front"></div>
        <div class="card-face card-back" id="card-back"></div>
      </div>
    </div>
  </div>
  <div class="card-nav">
    <button class="btn-nav" id="btn-prev" onclick="prevCard()" disabled>← 이전</button>
    <button class="btn-nav" id="btn-next-card" onclick="nextCard()">다음 →</button>
    <button class="btn-to-quiz" id="btn-to-quiz" onclick="startQuiz()">퀴즈 시작 →</button>
  </div>
</div>

<!-- ── 퀴즈 ── -->
<div class="screen" id="screen-quiz">
  <div class="quiz-header">
    <div class="quiz-phase-label" id="quiz-phase-label"></div>
    <div class="quiz-phase-title" id="quiz-phase-title"></div>
    <div class="quiz-prog-wrap"><div class="quiz-prog-bar" id="quiz-prog"></div></div>
  </div>
  <div class="quiz-body" id="quiz-body">
    <div class="quiz-qnum" id="quiz-qnum"></div>
    <div class="quiz-q-card">
      <div class="quiz-q-desc" id="quiz-q-desc"></div>
      <div class="quiz-q-main" id="quiz-q-main"></div>
      <div class="quiz-q-sub" id="quiz-q-sub"></div>
    </div>
    <!-- 객관식 (1, 2단계) -->
    <div class="quiz-opts" id="quiz-opts"></div>
    <div class="quiz-feedback" id="quiz-feedback"></div>
    <button class="btn-next-q" id="btn-next-q" onclick="nextQuestion()">다음 →</button>
    <!-- 영작 (3단계) -->
    <div class="writing-area" id="writing-area" style="display:none">
      <div class="writing-label">영어로 번역해보세요 (말하거나 직접 입력)</div>
      <textarea class="writing-input" id="writing-input" placeholder="영어 문장을 입력하세요..."></textarea>
      <div class="writing-btns">
        <button class="btn-voice" id="btn-voice" onclick="toggleVoice()">🎤 음성 입력</button>
        <button class="btn-submit" id="btn-submit" onclick="submitWriting()">제출</button>
      </div>
      <div class="writing-result" id="writing-result">
        <div class="result-verdict" id="result-verdict"></div>
        <div class="result-ref-label">참고 예문</div>
        <div class="result-ref" id="result-ref"></div>
        <button class="btn-next-q" style="display:block;margin-top:14px" onclick="nextQuestion()">다음 →</button>
      </div>
    </div>
  </div>
</div>

<!-- ── 단계 전환 ── -->
<div class="screen" id="screen-phase">
  <div class="phase-icon" id="phase-icon"></div>
  <div class="phase-title" id="phase-title"></div>
  <div class="phase-desc" id="phase-desc"></div>
  <div class="phase-score-box">
    <div class="sc" id="phase-sc"></div>
    <div class="sl" id="phase-sl"></div>
  </div>
  <button class="btn-next-phase" id="btn-next-phase" onclick="nextPhase()"></button>
</div>

<!-- ── 완료 ── -->
<div class="screen" id="screen-done">
  <div class="done-emoji" id="done-emoji">🎉</div>
  <div class="done-title">퀴즈 완료!</div>
  <div class="done-total" id="done-total"></div>
  <div class="done-breakdown" id="done-breakdown"></div>
  <div class="wrong-list" id="wrong-list"></div>
  <button class="btn-retry" onclick="location.reload()">다시 하기</button>
  <div class="done-note">틀린 단어는 5일간 매일 복습에 포함됩니다</div>
</div>

<script>
const WORDS = WORDS_JSON_PLACEHOLDER;
const ALL_WORDS = ALL_WORDS_JSON_PLACEHOLDER;
const TODAY = "TODAY_PLACEHOLDER";
const OPENAI_KEY = "OPENAI_API_KEY_PLACEHOLDER";
const GH_TOKEN = "GH_TOKEN_PLACEHOLDER";
const GH_REPO = "gezzang82/linzi-vocab";

// ── 유틸 ──
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}
function getLS(k, def) { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch { return def; } }
function setLS(k, v) { localStorage.setItem(k, JSON.stringify(v)); }

function speak(text, lang = 'en-US', rate = 0.85) {
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = rate;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

// ── GitHub API ──
let _ghTrackerCache = null;

async function ghGetTracker() {
  try {
    const res = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/vocab_tracker.json`, {
      headers: { 'Authorization': `token ${GH_TOKEN}`, 'Accept': 'application/vnd.github.v3+json' }
    });
    if (!res.ok) return null;
    const data = await res.json();
    const obj = JSON.parse(decodeURIComponent(escape(atob(data.content.replace(/\n/g, '')))));
    obj._sha = data.sha;
    _ghTrackerCache = obj;
    return obj;
  } catch { return null; }
}

async function ghSaveTracker(tracker) {
  const sha = tracker._sha;
  const copy = { ...tracker };
  delete copy._sha;
  try {
    const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(copy, null, 2))));
    const res = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/vocab_tracker.json`, {
      method: 'PUT',
      headers: {
        'Authorization': `token ${GH_TOKEN}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ message: `quiz result ${TODAY}`, content: encoded, sha })
    });
    if (res.ok) {
      const d = await res.json();
      _ghTrackerCache = copy;
      _ghTrackerCache._sha = d.content.sha;
    }
    return res.ok;
  } catch { return false; }
}

// ── 5일 복습 ──
function markWrong5(word) {
  const store = getLS('wrong5', {});
  const exp = new Date(TODAY + 'T00:00:00');
  exp.setDate(exp.getDate() + 5);
  store[word] = { exp: exp.toISOString().slice(0, 10), count: (store[word]?.count || 0) + 1 };
  setLS('wrong5', store);
}
function resolveWrong5(word) {
  // 복습 단어를 맞췄을 때 목록에서 제거
  const store = getLS('wrong5', {});
  if (store[word]) { delete store[word]; setLS('wrong5', store); }
}
function getDueWords() {
  const store = getLS('wrong5', {});
  const todaySet = new Set(WORDS.map(w => w.word));
  return Object.keys(store)
    .filter(w => store[w].exp >= TODAY && !todaySet.has(w))
    .map(w => ALL_WORDS.find(x => x.word === w))
    .filter(Boolean);
}

// ── 스트릭 ──
function initStreak() {
  let streak = getLS('streak', 0);
  const last = getLS('lastStudy', '');
  const yd = new Date(TODAY + 'T00:00:00');
  yd.setDate(yd.getDate() - 1);
  if (last === TODAY) return streak;
  streak = (last === yd.toISOString().slice(0, 10)) ? streak + 1 : 1;
  setLS('streak', streak);
  setLS('lastStudy', TODAY);
  return streak;
}

// ── 통계 표시 ──
function renderStats(tracker) {
  const history = tracker.quiz_history || [];
  if (history.length === 0) return;

  document.getElementById('home-stats-history').style.display = 'block';
  document.getElementById('hsh-total-days').textContent = history.length + '일';
  document.getElementById('hsh-total-quiz').textContent = history.length + '회';

  // 최근 7일 정확도
  const recent = history.slice(-7);
  const totalScore = recent.reduce((s, h) => s + (h.p1_score || 0) + (h.p2_score || 0), 0);
  const totalQ = recent.reduce((s, h) => s + (h.p1_total || 0) + (h.p2_total || 0), 0);
  if (totalQ > 0) {
    document.getElementById('hsh-accuracy').textContent = Math.round(totalScore / totalQ * 100) + '%';
  }

  // 자주 틀리는 단어 (wrong_words 빈도 집계)
  const wrongCount = {};
  history.forEach(h => (h.wrong_words || []).forEach(w => { wrongCount[w] = (wrongCount[w] || 0) + 1; }));
  const topWrong = Object.entries(wrongCount).sort((a, b) => b[1] - a[1]).slice(0, 5);
  if (topWrong.length > 0) {
    document.getElementById('hsh-weak-row').style.display = 'flex';
    document.getElementById('hsh-weak-words').innerHTML =
      topWrong.map(([w, c]) => `<span class="weak-tag">${w} (${c})</span>`).join('');
  }
}

// ── 카드 상태 ──
let studyWords = [];
let cardIdx = 0;
let lang = 'ko';
let flipped = false;

function startQuizOnly() {
  studyWords = shuffle([...WORDS, ...getDueWords()]);
  startQuiz();
}

function startStudy() {
  studyWords = shuffle([...WORDS, ...getDueWords()]);
  cardIdx = 0; lang = 'ko'; flipped = false;
  document.getElementById('tab-ko').classList.add('active');
  document.getElementById('tab-en').classList.remove('active');
  renderCard();
  showScreen('screen-card');
}

function setLang(l) {
  lang = l;
  document.getElementById('tab-ko').classList.toggle('active', l === 'ko');
  document.getElementById('tab-en').classList.toggle('active', l === 'en');
  flipped = false;
  document.getElementById('flashcard').classList.remove('flipped');
  renderCard();
}

function renderCard() {
  const w = studyWords[cardIdx];
  const total = studyWords.length;
  const isLast = cardIdx === total - 1;

  document.getElementById('card-counter').textContent = `${cardIdx + 1} / ${total}`;
  document.getElementById('card-prog').style.width = `${(cardIdx + 1) / total * 100}%`;
  document.getElementById('btn-prev').disabled = cardIdx === 0;
  document.getElementById('btn-next-card').style.display = isLast ? 'none' : '';
  document.getElementById('btn-to-quiz').classList.toggle('show', isLast);
  flipped = false;
  document.getElementById('flashcard').classList.remove('flipped');

  const front = document.getElementById('card-front');
  const back = document.getElementById('card-back');

  if (lang === 'ko') {
    front.innerHTML = `
      <div class="card-pos">${w.pos}</div>
      <div class="card-meaning">${w.meaning}</div>
      <div class="card-hint">👆 탭해서 영어 확인</div>`;
    back.innerHTML = `
      <div class="card-pos">${w.pos}</div>
      <div class="card-word">${w.word}</div>
      <div class="tts-row">
        <div class="card-pron">${w.pronunciation}</div>
        <button class="tts-btn" onclick="event.stopPropagation();speak(studyWords[cardIdx].word)">🔊</button>
      </div>
      <div style="position:relative;width:100%">
        <div class="card-example">💬 ${w.example}</div>
        <button class="tts-btn" style="position:absolute;top:4px;right:4px" onclick="event.stopPropagation();speak(studyWords[cardIdx].example)">🔊</button>
      </div>
      <div class="card-tip">💡 ${w.tip}</div>`;
  } else {
    front.innerHTML = `
      <div class="card-pos">${w.pos}</div>
      <div class="card-word">${w.word}</div>
      <div class="tts-row">
        <div class="card-pron">${w.pronunciation}</div>
        <button class="tts-btn" onclick="event.stopPropagation();speak(studyWords[cardIdx].word)">🔊</button>
      </div>
      <div class="card-hint">👆 탭해서 뜻 확인</div>`;
    back.innerHTML = `
      <div class="card-meaning">${w.meaning}</div>
      <div style="position:relative;width:100%">
        <div class="card-example">💬 ${w.example}</div>
        <button class="tts-btn" style="position:absolute;top:4px;right:4px" onclick="event.stopPropagation();speak(studyWords[cardIdx].example)">🔊</button>
      </div>

  }
}

function flipCard() {
  flipped = !flipped;
  document.getElementById('flashcard').classList.toggle('flipped', flipped);
}
function prevCard() { if (cardIdx > 0) { cardIdx--; renderCard(); } }
function nextCard() { if (cardIdx < studyWords.length - 1) { cardIdx++; renderCard(); } }

// ── 퀴즈 상태 ──
let qPhase = 1;
let qWords = [];
let qIdx = 0;
let phaseScores = [0, 0, 0];
let wrongWords = new Set();
let qAnswered = false;
let voiceRec = null;

const PHASES = [
  { label: '1단계 / 2', title: '한국어 → 영어', desc: '한국어 뜻을 보고 올바른 단어를 고르세요' },
  { label: '2단계 / 2', title: '영작 퀴즈',     desc: '한국어 문장을 영어로 옮겨보세요' },
];

function startQuiz() {
  qPhase = 1; qWords = shuffle([...studyWords]);
  qIdx = 0; phaseScores = [0, 0, 0]; wrongWords = new Set();
  renderQuestion();
  showScreen('screen-quiz');
}

function renderQuestion() {
  const w = qWords[qIdx];
  const total = qWords.length;
  const p = PHASES[qPhase - 1];

  document.getElementById('quiz-phase-label').textContent = p.label;
  document.getElementById('quiz-phase-title').textContent = p.title;
  document.getElementById('quiz-prog').style.width = `${(qIdx + 1) / total * 100}%`;
  document.getElementById('quiz-qnum').textContent = `${qIdx + 1} / ${total} 문제`;
  document.getElementById('quiz-q-desc').textContent = p.desc;
  document.getElementById('quiz-feedback').textContent = '';
  document.getElementById('quiz-feedback').className = 'quiz-feedback';
  document.getElementById('btn-next-q').style.display = 'none';
  qAnswered = false;

  const isWriting = qPhase === 2;
  document.getElementById('quiz-opts').style.display = isWriting ? 'none' : 'flex';
  document.getElementById('writing-area').style.display = isWriting ? 'flex' : 'none';
  document.getElementById('quiz-q-sub').textContent = '';

  if (isWriting) {
    renderWritingQuestion(w);
    return;
  }

  // 1단계: 한국어 → 영어
  const others = shuffle(ALL_WORDS.filter(x => x.word !== w.word)).slice(0, 3);
  const qMain = w.meaning, qSub = '';
  const choices = shuffle([w, ...others]);
  const opts = choices.map(x => ({ text: x.word, correct: x.word === w.word }));
  const correctText = w.word;

  document.getElementById('quiz-q-main').textContent = qMain;
  document.getElementById('quiz-q-sub').textContent = qSub;

  const container = document.getElementById('quiz-opts');
  container.innerHTML = '';
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'quiz-opt';
    btn.textContent = opt.text;
    btn.dataset.correct = opt.correct;
    btn.dataset.correctText = correctText;
    btn.onclick = () => selectMC(btn, w.word);
    container.appendChild(btn);
  });
}

function selectMC(btn, word) {
  if (qAnswered) return;
  qAnswered = true;
  const isCorrect = btn.dataset.correct === 'true';
  const correctText = btn.dataset.correctText;
  document.querySelectorAll('.quiz-opt').forEach(b => {
    b.disabled = true;
    if (b.textContent === correctText) b.classList.add('correct');
  });
  const fb = document.getElementById('quiz-feedback');
  if (isCorrect) {
    fb.textContent = '✅ 정답!'; fb.className = 'quiz-feedback ok';
    phaseScores[qPhase - 1]++;
    resolveWrong5(word); // 복습 단어 맞추면 목록에서 제거
  } else {
    btn.classList.add('wrong');
    fb.textContent = '❌ 오답'; fb.className = 'quiz-feedback fail';
    wrongWords.add(word); markWrong5(word);
  }
  document.getElementById('btn-next-q').style.display = 'block';
}

// ── 영작 퀴즈 ──
function renderWritingQuestion(w) {
  document.getElementById('quiz-q-main').textContent = w.example_ko || w.meaning;
  document.getElementById('writing-input').value = '';
  // 이전 피드백 요소 제거
  const prev = document.getElementById('ai-feedback');
  if (prev) prev.remove();
  document.getElementById('writing-result').classList.remove('show');
  document.getElementById('btn-submit').disabled = false;
  document.getElementById('btn-submit').textContent = '제출';
  document.getElementById('btn-voice').textContent = '🎤 음성 입력';
  document.getElementById('btn-voice').classList.remove('listening');
}

function toggleVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Chrome 브라우저에서 음성 인식이 지원됩니다.'); return; }

  if (voiceRec) { voiceRec.stop(); voiceRec = null; return; }

  voiceRec = new SR();
  voiceRec.lang = 'en-US';
  voiceRec.continuous = false;
  voiceRec.interimResults = false;

  const btn = document.getElementById('btn-voice');
  btn.textContent = '🔴 듣는 중... (탭하여 중지)';
  btn.classList.add('listening');

  voiceRec.onresult = e => {
    document.getElementById('writing-input').value = e.results[0][0].transcript;
  };
  voiceRec.onend = () => {
    btn.textContent = '🎤 음성 입력';
    btn.classList.remove('listening');
    voiceRec = null;
  };
  voiceRec.onerror = () => {
    btn.textContent = '🎤 음성 입력';
    btn.classList.remove('listening');
    voiceRec = null;
  };
  voiceRec.start();
}

async function judgeWithAI(korSentence, engAnswer, targetWord, referenceAnswer) {
  const prompt = `You are a strict English teacher grading a translation exercise.

Korean sentence: "${korSentence}"
Target word: "${targetWord}"
Student's answer: "${engAnswer}"
Reference answer: "${referenceAnswer}"

Grading rules (ALL must pass):
1. The target word or its correct conjugated form must be used (e.g. "promoted" for "promote", "was promoted" is fine)
2. The sentence must be grammatically complete (subject + verb minimum)
3. The core meaning of the Korean sentence must be conveyed
4. Incomplete fragments like "She promoted the" are WRONG

Respond with JSON only (no other text):
{"correct": true or false, "feedback": "한국어로 짧은 피드백. 틀렸으면 어떤 점이 잘못됐는지 명확히 설명."}`;

  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${OPENAI_KEY}`
    },
    body: JSON.stringify({
      model: 'gpt-4o-mini',
      messages: [{ role: 'user', content: prompt }],
      temperature: 0.1,
      max_tokens: 150,
      response_format: { type: 'json_object' }
    })
  });

  if (!res.ok) throw new Error(`API ${res.status}`);
  const data = await res.json();
  return JSON.parse(data.choices[0].message.content.trim());
}

async function submitWriting() {
  const w = qWords[qIdx];
  const userAnswer = document.getElementById('writing-input').value.trim();
  if (!userAnswer) return;

  document.getElementById('btn-submit').disabled = true;
  document.getElementById('btn-submit').textContent = '판정 중...';
  if (voiceRec) { voiceRec.stop(); voiceRec = null; }

  let isCorrect = false;
  let feedbackText = '';

  try {
    const result = await judgeWithAI(
      w.example_ko || w.meaning,
      userAnswer,
      w.word,
      w.example
    );
    isCorrect = result.correct;
    feedbackText = result.feedback;
  } catch (e) {
    // AI 실패 시 fallback: 5단어 이상 + 핵심 단어 포함 + 마침표/완성 문장 추정
    const norm = userAnswer.toLowerCase().trim();
    const base = w.word.toLowerCase().split(' ')[0];
    const wordCount = norm.split(/\s+/).filter(Boolean).length;
    const hasWord = norm.includes(base);
    const isComplete = wordCount >= 5;
    isCorrect = hasWord && isComplete;
    feedbackText = isCorrect
      ? '좋아요! (AI 판정 일시 불가, 자동 채점됨)'
      : wordCount < 5
        ? '문장이 너무 짧아요. 완성된 문장으로 써보세요.'
        : '목표 단어를 포함해서 다시 시도해보세요.';
  }

  document.getElementById('btn-submit').textContent = '제출';

  const verdict = document.getElementById('result-verdict');
  if (isCorrect) {
    verdict.textContent = '✅ 정답!';
    verdict.className = 'result-verdict ok';
    phaseScores[1]++;
    resolveWrong5(w.word);
  } else {
    verdict.textContent = '❌ 오답';
    verdict.className = 'result-verdict fail';
    wrongWords.add(w.word); markWrong5(w.word);
  }

  // 피드백 표시 (기존 제거 후 새로 추가)
  const prevFb = document.getElementById('ai-feedback');
  if (prevFb) prevFb.remove();
  if (feedbackText) {
    const feedbackEl = document.createElement('div');
    feedbackEl.id = 'ai-feedback';
    feedbackEl.style.cssText = 'font-size:.85rem;color:#4b5563;margin:6px 0 10px;line-height:1.5';
    feedbackEl.textContent = feedbackText;
    document.getElementById('result-verdict').after(feedbackEl);
  }

  // 참고 예문 핵심 단어 강조
  const highlighted = w.example.replace(
    new RegExp(`(${w.word.split(' ')[0]}\\w*)`, 'gi'),
    '<em>$1</em>'
  );
  document.getElementById('result-ref').innerHTML = highlighted;
  document.getElementById('writing-result').classList.add('show');
}

function nextQuestion() {
  qIdx++;
  if (qIdx >= qWords.length) { showPhaseEnd(); return; }
  renderQuestion();
}

// ── 단계 전환 ──
function showPhaseEnd() {
  const score = phaseScores[qPhase - 1];
  const total = qWords.length;
  const isLast = qPhase === 2;
  const icons = ['✏️', '🖊️'];
  const nextLabels = ['2단계: 영작 퀴즈 시작', '결과 보기'];
  const descs = [
    '마지막! 한국어 문장을 영어로 영작해보세요',
    '모든 퀴즈가 끝났어요!',
  ];

  document.getElementById('phase-icon').textContent = icons[qPhase - 1];
  document.getElementById('phase-title').textContent = PHASES[qPhase - 1].title + ' 완료';
  document.getElementById('phase-desc').textContent = descs[qPhase - 1];
  document.getElementById('phase-sc').textContent = `${score} / ${total}`;
  document.getElementById('phase-sl').textContent = Math.round(score / total * 100) + '% 정확도';
  document.getElementById('btn-next-phase').textContent = nextLabels[qPhase - 1];
  showScreen('screen-phase');
}

function nextPhase() {
  if (qPhase === 2) { showDone(); return; }
  qPhase++;
  qWords = shuffle([...studyWords]);
  qIdx = 0;
  renderQuestion();
  showScreen('screen-quiz');
}

// ── 결과 GitHub 저장 ──
async function saveResultToGH() {
  const status = document.getElementById('save-status');
  status.textContent = '결과 저장 중...';
  const tracker = await ghGetTracker();
  if (!tracker) { status.textContent = ''; return; }

  if (!tracker.quiz_history) tracker.quiz_history = [];

  // 오늘 기록 중복 방지 (같은 날 여러 번 하면 마지막 것으로 덮어씀)
  const todayIdx = tracker.quiz_history.findIndex(h => h.date === TODAY);
  const record = {
    date: TODAY,
    p1_score: phaseScores[0], p1_total: qWords.length,
    p2_score: phaseScores[1], p2_total: qWords.length,
    wrong_words: [...wrongWords],
    streak: getLS('streak', 1)
  };
  if (todayIdx >= 0) tracker.quiz_history[todayIdx] = record;
  else tracker.quiz_history.push(record);
  if (tracker.quiz_history.length > 60) tracker.quiz_history = tracker.quiz_history.slice(-60);

  // wrong5 동기화
  tracker.wrong5 = getLS('wrong5', {});

  const ok = await ghSaveTracker(tracker);
  status.textContent = ok ? '✅ 기록 저장됨' : '⚠️ 저장 실패 (오프라인?)';
  setTimeout(() => { status.textContent = ''; }, 3000);
}

// ── 완료 ──
function showDone() {
  const total = phaseScores.reduce((a, b) => a + b, 0);
  const totalQ = qWords.length * 2;
  const pct = Math.round(total / totalQ * 100);
  const emoji = pct >= 90 ? '🏆' : pct >= 70 ? '🎉' : pct >= 50 ? '👍' : '💪';

  document.getElementById('done-emoji').textContent = emoji;
  document.getElementById('done-total').textContent = `${total} / ${totalQ}점`;
  document.getElementById('done-breakdown').innerHTML = PHASES.map((p, i) => `
    <div class="phase-row">
      <span class="pl">${p.title}</span>
      <span class="pv">${phaseScores[i]} / ${qWords.length}</span>
    </div>`).join('');

  const wl = document.getElementById('wrong-list');
  if (wrongWords.size > 0) {
    wl.innerHTML = '<h3>틀린 단어 — 5일간 복습 예정</h3>' +
      [...wrongWords].map(word => {
        const w = ALL_WORDS.find(x => x.word === word);
        return w ? `<div class="wrong-item"><div class="ww">${w.word}</div><div class="wm">${w.meaning}</div></div>` : '';
      }).join('');
  }
  showScreen('screen-done');
  saveResultToGH(); // 비동기 저장
}
