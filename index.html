<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📚 오늘의 영단어 10개</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Noto Sans KR',sans-serif;background:#f0f4ff;min-height:100vh;overflow-x:hidden}
.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex}

/* ── 홈 ── */
#screen-home{background:linear-gradient(160deg,#4f46e5,#7c3aed);color:white;align-items:center;padding:44px 24px 40px;gap:20px;overflow-y:auto}
.home-logo{font-size:2.8rem}
.home-title{font-size:1.6rem;font-weight:900;letter-spacing:-.5px}
.home-date{font-size:.8rem;opacity:.7}
.streak-row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.15);border-radius:99px;padding:10px 24px}
.streak-fire{font-size:1.5rem}
.streak-num{font-size:1.8rem;font-weight:900}
.streak-label{font-size:.8rem;opacity:.8}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.stat-card{background:rgba(255,255,255,.15);border-radius:18px;padding:18px;text-align:center}
.stat-card .val{font-size:2rem;font-weight:900}
.stat-card .lbl{font-size:.75rem;opacity:.75;margin-top:3px}
.btn-start{background:white;color:#4f46e5;border:none;border-radius:99px;padding:16px;font-size:1.1rem;font-weight:800;cursor:pointer;width:100%;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.btn-start:active{transform:scale(.98)}

/* ── 카드 ── */
#screen-card{background:#f0f4ff}
.card-header{background:white;padding:14px 16px 0;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.lang-tabs{display:flex;gap:0;background:#f0f4ff;border-radius:12px;padding:4px;margin-bottom:12px}
.lang-tab{flex:1;padding:8px 4px;font-size:.85rem;font-weight:600;border:none;background:transparent;color:#6b7280;border-radius:8px;cursor:pointer;transition:all .2s}
.lang-tab.active{background:#4f46e5;color:white}
.card-prog-wrap{height:4px;background:#e5e7eb;margin:0 -16px}
.card-prog-bar{height:4px;background:#4f46e5;transition:width .3s}
.card-counter{text-align:center;font-size:.82rem;color:#6b7280;padding:10px 0 4px}
.card-area{flex:1;display:flex;align-items:center;justify-content:center;padding:12px 20px}
.flashcard{width:100%;max-width:420px;height:280px;perspective:1200px;cursor:pointer}
.flashcard-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg)}
.card-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;box-shadow:0 6px 24px rgba(79,70,229,.12);background:white}
.card-back{transform:rotateY(180deg)}
.card-pos{background:#e0e7ff;color:#4338ca;padding:3px 12px;border-radius:99px;font-size:.78rem;font-weight:600;margin-bottom:10px}
.card-word{font-size:2.1rem;font-weight:900;color:#1e1b4b;text-align:center}
.card-pron{font-size:.85rem;color:#6b7280;margin-top:4px}
.card-meaning{font-size:1.35rem;font-weight:700;color:#1e1b4b;text-align:center;line-height:1.4}
.card-example{font-size:.8rem;color:#4b5563;background:#f9fafb;border-radius:12px;padding:10px 14px;margin-top:10px;line-height:1.6;text-align:center;width:100%}
.card-tip{font-size:.77rem;color:#d97706;margin-top:8px;text-align:center}
.card-hint{font-size:.82rem;color:#9ca3af;margin-top:14px}
.tts-btn{background:none;border:none;cursor:pointer;font-size:1rem;padding:3px 7px;border-radius:8px;margin-top:2px}
.tts-btn:active{background:#e0e7ff}
.card-nav{display:flex;align-items:center;gap:10px;padding:10px 16px 28px}
.btn-nav{flex:1;background:white;border:2px solid #e5e7eb;color:#374151;border-radius:16px;padding:14px;font-size:.95rem;font-weight:600;cursor:pointer;transition:border-color .2s}
.btn-nav:hover{border-color:#4f46e5;color:#4f46e5}
.btn-nav:disabled{opacity:.3;cursor:default;border-color:#e5e7eb;color:#9ca3af}
.btn-to-quiz{flex:2;background:#4f46e5;color:white;border:none;border-radius:16px;padding:14px;font-size:1rem;font-weight:700;cursor:pointer;display:none}
.btn-to-quiz.show{display:block}

/* ── 퀴즈 ── */
#screen-quiz{background:#f0f4ff}
.quiz-header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:white;padding:16px 20px}
.quiz-phase-label{font-size:.78rem;opacity:.75;margin-bottom:2px}
.quiz-phase-title{font-size:1.05rem;font-weight:700}
.quiz-prog-wrap{background:rgba(255,255,255,.25);border-radius:99px;height:5px;margin-top:10px}
.quiz-prog-bar{background:white;border-radius:99px;height:5px;transition:width .4s}
.quiz-body{flex:1;padding:16px;overflow-y:auto}
.quiz-qnum{font-size:.78rem;color:#6b7280;margin-bottom:8px;font-weight:600}
.quiz-q-card{background:white;border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.quiz-q-desc{font-size:.78rem;color:#6b7280;font-weight:600;margin-bottom:8px}
.quiz-q-main{font-size:1.25rem;font-weight:800;color:#1e1b4b;text-align:center;line-height:1.4}
.quiz-q-sub{font-size:.82rem;color:#6b7280;text-align:center;margin-top:4px}
.quiz-opts{display:flex;flex-direction:column;gap:10px}
.quiz-opt{background:white;border:2px solid #e5e7eb;border-radius:14px;padding:13px 16px;font-size:.88rem;cursor:pointer;text-align:left;color:#374151;transition:all .15s;line-height:1.5}
.quiz-opt:hover:not(:disabled){border-color:#4f46e5;background:#eef2ff}
.quiz-opt.correct{background:#d1fae5;border-color:#10b981;color:#065f46;font-weight:600}
.quiz-opt.wrong{background:#fee2e2;border-color:#ef4444;color:#991b1b}
.quiz-opt:disabled{cursor:default}
.quiz-feedback{text-align:center;font-size:.9rem;font-weight:600;min-height:22px;margin-top:12px}
.quiz-feedback.ok{color:#10b981}
.quiz-feedback.fail{color:#ef4444}
.btn-next-q{width:100%;background:#4f46e5;color:white;border:none;border-radius:16px;padding:15px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:14px;display:none}

/* ── 단계 전환 ── */
#screen-phase{background:linear-gradient(160deg,#4f46e5,#7c3aed);color:white;align-items:center;justify-content:center;padding:32px 24px;gap:20px}
.phase-icon{font-size:3.5rem}
.phase-title{font-size:1.5rem;font-weight:900;text-align:center}
.phase-desc{font-size:.9rem;opacity:.8;text-align:center;line-height:1.6}
.phase-score{background:rgba(255,255,255,.15);border-radius:16px;padding:14px 32px;text-align:center}
.phase-score .sc{font-size:2rem;font-weight:900}
.phase-score .sl{font-size:.8rem;opacity:.8}
.btn-next-phase{background:white;color:#4f46e5;border:none;border-radius:99px;padding:14px 40px;font-size:1rem;font-weight:800;cursor:pointer}

/* ── 완료 ── */
#screen-done{background:linear-gradient(160deg,#4f46e5,#7c3aed);color:white;align-items:center;padding:40px 24px;gap:16px;overflow-y:auto}
.done-emoji{font-size:3.5rem}
.done-title{font-size:1.6rem;font-weight:900}
.done-total{font-size:2.5rem;font-weight:900}
.done-breakdown{background:rgba(255,255,255,.15);border-radius:20px;padding:16px;width:100%}
.phase-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.phase-row+.phase-row{border-top:1px solid rgba(255,255,255,.15)}
.phase-row .pl{font-size:.85rem;opacity:.85}
.phase-row .pv{font-size:1rem;font-weight:700}
.wrong-list{width:100%}
.wrong-list h3{font-size:.85rem;opacity:.75;margin-bottom:10px}
.wrong-item{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.wrong-item .ww{font-weight:700;font-size:.95rem}
.wrong-item .wm{font-size:.8rem;opacity:.7;margin-top:2px}
.btn-retry{background:white;color:#4f46e5;border:none;border-radius:99px;padding:14px 40px;font-size:1rem;font-weight:800;cursor:pointer}
.done-note{font-size:.75rem;opacity:.6;text-align:center;padding:0 8px}
</style>
</head>
<body>

<!-- ── 홈 ── -->
<div class="screen active" id="screen-home">
  <div class="home-logo">📚</div>
  <div class="home-title">린지단어장</div>
  <div class="home-date" id="home-date"></div>
  <div class="streak-row">
    <span class="streak-fire">🔥</span>
    <span class="streak-num" id="streak-num">0</span>
    <span class="streak-label">일 연속 학습</span>
  </div>
  <div class="stats-grid">
    <div class="stat-card">
      <div class="val">10</div>
      <div class="lbl">오늘 단어</div>
    </div>
    <div class="stat-card">
      <div class="val" id="stat-review">0</div>
      <div class="lbl">복습 대기</div>
    </div>
  </div>
  <button class="btn-start" onclick="startStudy()">학습 시작 →</button>
</div>

<!-- ── 카드 ── -->
<div class="screen" id="screen-card">
  <div class="card-header">
    <div class="lang-tabs">
      <button class="lang-tab active" id="tab-ko" onclick="setLang('ko')">🇰🇷 한국어 → 영어</button>
      <button class="lang-tab" id="tab-en" onclick="setLang('en')">🇺🇸 영어 → 한국어</button>
    </div>
    <div class="card-prog-wrap"><div class="card-prog-bar" id="card-prog"></div></div>
  </div>
  <div class="card-counter" id="card-counter"></div>
  <div class="card-area">
    <div class="flashcard" id="flashcard" onclick="flipCard()">
      <div class="flashcard-inner">
        <div class="card-face" id="card-front"></div>
        <div class="card-face card-back" id="card-back"></div>
      </div>
    </div>
  </div>
  <div class="card-nav">
    <button class="btn-nav" id="btn-prev" onclick="prevCard()" disabled>← 이전</button>
    <button class="btn-nav" id="btn-next-card" onclick="nextCard()">다음 →</button>
    <button class="btn-to-quiz" id="btn-to-quiz" onclick="startQuiz()">퀴즈 시작 →</button>
  </div>
</div>

<!-- ── 퀴즈 ── -->
<div class="screen" id="screen-quiz">
  <div class="quiz-header">
    <div class="quiz-phase-label" id="quiz-phase-label"></div>
    <div class="quiz-phase-title" id="quiz-phase-title"></div>
    <div class="quiz-prog-wrap"><div class="quiz-prog-bar" id="quiz-prog"></div></div>
  </div>
  <div class="quiz-body">
    <div class="quiz-qnum" id="quiz-qnum"></div>
    <div class="quiz-q-card">
      <div class="quiz-q-desc" id="quiz-q-desc"></div>
      <div class="quiz-q-main" id="quiz-q-main"></div>
      <div class="quiz-q-sub" id="quiz-q-sub"></div>
    </div>
    <div class="quiz-opts" id="quiz-opts"></div>
    <div class="quiz-feedback" id="quiz-feedback"></div>
    <button class="btn-next-q" id="btn-next-q" onclick="nextQuestion()">다음 →</button>
  </div>
</div>

<!-- ── 단계 전환 ── -->
<div class="screen" id="screen-phase">
  <div class="phase-icon" id="phase-icon"></div>
  <div class="phase-title" id="phase-title"></div>
  <div class="phase-desc" id="phase-desc"></div>
  <div class="phase-score">
    <div class="sc" id="phase-sc"></div>
    <div class="sl" id="phase-sl"></div>
  </div>
  <button class="btn-next-phase" id="btn-next-phase" onclick="nextPhase()"></button>
</div>

<!-- ── 완료 ── -->
<div class="screen" id="screen-done">
  <div class="done-emoji" id="done-emoji">🎉</div>
  <div class="done-title">퀴즈 완료!</div>
  <div class="done-total" id="done-total"></div>
  <div class="done-breakdown" id="done-breakdown"></div>
  <div class="wrong-list" id="wrong-list"></div>
  <button class="btn-retry" onclick="location.reload()">다시 하기</button>
  <div class="done-note">틀린 단어는 5일간 매일 복습에 포함됩니다</div>
</div>

<script>
const WORDS = [{"word": "prefer", "pronunciation": "/prɪˈfɜːr/", "pos": "v", "meaning": "선호하다", "example": "I prefer tea to coffee in the morning.", "tip": "pre+fer(가져오다) → 앞으로 가져오다 = 선호"}, {"word": "negotiate", "pronunciation": "/nɪˈɡoʊʃieɪt/", "pos": "v", "meaning": "협상하다", "example": "They negotiated the price for an hour.", "tip": "neg+otiate(일) → 조건을 두고 주고받다"}, {"word": "memorize", "pronunciation": "/ˈmeməraɪz/", "pos": "v", "meaning": "암기하다, 외우다", "example": "I need to memorize these vocabulary words.", "tip": "memory+ize → 기억 속에 집어넣다"}, {"word": "struggle", "pronunciation": "/ˈstrʌɡl/", "pos": "v/n", "meaning": "애쓰다, 힘들어하다", "example": "Many students struggle with grammar rules.", "tip": "strug(저항) → 저항과 싸우며 나아가다"}, {"word": "deadline", "pronunciation": "/ˈdedlaɪn/", "pos": "n", "meaning": "마감 기한", "example": "The deadline for the assignment is next Friday.", "tip": "dead+line → 넘으면 '죽는' 선"}, {"word": "insist", "pronunciation": "/ɪnˈsɪst/", "pos": "v", "meaning": "주장하다, 고집하다", "example": "She insisted on paying for the meal herself.", "tip": "in+sist(서다) → 뜻 위에 굳건히 서다"}, {"word": "persuade", "pronunciation": "/pəˈsweɪd/", "pos": "v", "meaning": "설득하다", "example": "She persuaded him to try a new approach.", "tip": "per+suade(달콤한) → 달콤하게 설득하다"}, {"word": "give up", "pronunciation": "/ɡɪv ʌp/", "pos": "v", "meaning": "포기하다", "example": "Never give up on your dreams.", "tip": "give(주다)+up → 위로 넘겨버리다 = 포기"}, {"word": "disagree", "pronunciation": "/ˌdɪsəˈɡriː/", "pos": "v", "meaning": "반대하다, 의견이 다르다", "example": "I disagree with your opinion on this matter.", "tip": "dis(반대)+agree → 동의와 반대 방향"}, {"word": "concentrate", "pronunciation": "/ˈkɒnsntreɪt/", "pos": "v", "meaning": "집중하다", "example": "It's hard to concentrate when there's so much noise.", "tip": "con+center → 중심으로 모으다"}];

const TODAY = "2026-05-31";

// ── 유틸 ──
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}
function getLS(k, def) { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch { return def; } }
function setLS(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
function speak(text, lang = 'en-US') {
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = 0.85;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}

// ── 5일 복습 ──
function markWrong5(word) {
  const store = getLS('wrong5', {});
  const exp = new Date(TODAY + 'T00:00:00');
  exp.setDate(exp.getDate() + 5);
  store[word] = { exp: exp.toISOString().slice(0, 10), count: (store[word]?.count || 0) + 1 };
  setLS('wrong5', store);
}
function getDueWords() {
  const store = getLS('wrong5', {});
  const todayWords = new Set(WORDS.map(w => w.word));
  return Object.keys(store)
    .filter(word => store[word].exp >= TODAY && !todayWords.has(word))
    .map(word => ALL_WORDS.find(w => w.word === word))
    .filter(Boolean);
}

// ── 스트릭 ──
function initStreak() {
  let streak = getLS('streak', 0);
  const last = getLS('lastStudy', '');
  const yd = new Date(TODAY + 'T00:00:00');
  yd.setDate(yd.getDate() - 1);
  const yesterday = yd.toISOString().slice(0, 10);
  if (last === TODAY) return streak;
  streak = (last === yesterday) ? streak + 1 : 1;
  setLS('streak', streak);
  setLS('lastStudy', TODAY);
  return streak;
}

// ── 홈 초기화 ──
(function() {
  const d = new Date(TODAY + 'T00:00:00');
  const days = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
  document.getElementById('home-date').textContent =
    d.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' }) + ' ' + days[d.getDay()];
  document.getElementById('streak-num').textContent = initStreak();
  document.getElementById('stat-review').textContent = getDueWords().length;
})();

// ── 카드 상태 ──
let studyWords = [];
let cardIdx = 0;
let lang = 'ko';
let flipped = false;

function startStudy() {
  studyWords = shuffle([...WORDS, ...getDueWords()]);
  cardIdx = 0;
  lang = 'ko';
  flipped = false;
  document.getElementById('tab-ko').classList.add('active');
  document.getElementById('tab-en').classList.remove('active');
  renderCard();
  showScreen('screen-card');
}

function setLang(l) {
  lang = l;
  document.getElementById('tab-ko').classList.toggle('active', l === 'ko');
  document.getElementById('tab-en').classList.toggle('active', l === 'en');
  flipped = false;
  document.getElementById('flashcard').classList.remove('flipped');
  renderCard();
}

function renderCard() {
  const w = studyWords[cardIdx];
  const total = studyWords.length;
  const isLast = cardIdx === total - 1;

  document.getElementById('card-counter').textContent = `${cardIdx + 1} / ${total}`;
  document.getElementById('card-prog').style.width = `${(cardIdx + 1) / total * 100}%`;
  document.getElementById('btn-prev').disabled = cardIdx === 0;
  document.getElementById('btn-next-card').style.display = isLast ? 'none' : '';
  document.getElementById('btn-to-quiz').classList.toggle('show', isLast);

  flipped = false;
  document.getElementById('flashcard').classList.remove('flipped');

  const front = document.getElementById('card-front');
  const back = document.getElementById('card-back');

  if (lang === 'ko') {
    front.innerHTML = `
      <div class="card-pos">${w.pos}</div>
      <div class="card-meaning">${w.meaning}</div>
      <div class="card-hint">👆 탭해서 영어 확인</div>`;
    back.innerHTML = `
      <div class="card-pos">${w.pos}</div>
      <div class="card-word">${w.word}</div>
      <div style="display:flex;align-items:center;gap:6px">
        <div class="card-pron">${w.pronunciation}</div>
        <button class="tts-btn" onclick="event.stopPropagation();speakCard()">🔊</button>
      </div>
      <div class="card-example">💬 ${w.example}</div>
      <div class="card-tip">💡 ${w.tip}</div>`;
  } else {
    front.innerHTML = `
      <div class="card-pos">${w.pos}</div>
      <div class="card-word">${w.word}</div>
      <div style="display:flex;align-items:center;gap:6px">
        <div class="card-pron">${w.pronunciation}</div>
        <button class="tts-btn" onclick="event.stopPropagation();speakCard()">🔊</button>
      </div>
      <div class="card-hint">👆 탭해서 뜻 확인</div>`;
    back.innerHTML = `
      <div class="card-meaning">${w.meaning}</div>
      <div class="card-example">💬 ${w.example}</div>
      <div class="card-tip">💡 ${w.tip}</div>`;
  }
}

function speakCard() { speak(studyWords[cardIdx].word); }
function flipCard() {
  flipped = !flipped;
  document.getElementById('flashcard').classList.toggle('flipped', flipped);
}
function prevCard() { if (cardIdx > 0) { cardIdx--; renderCard(); } }
function nextCard() { if (cardIdx < studyWords.length - 1) { cardIdx++; renderCard(); } }

  document.getElementById('quiz-q-desc').textContent = p.desc;
  document.getElementById('quiz-feedback').textContent = '';
  document.getElementById('quiz-feedback').className = 'quiz-feedback';
  document.getElementById('btn-next-q').style.display = 'none';
  qAnswered = false;

  let qMain, qSub, opts, correctText;
  const pool = ALL_WORDS.filter(x => x.word !== w.word);
  const others = shuffle(pool).slice(0, 3);

  if (qPhase === 1) {
    qMain = w.word;
    qSub = w.pronunciation;
    const choices = shuffle([w, ...others]);
    opts = choices.map(x => ({ text: x.meaning, correct: x.word === w.word }));
    correctText = w.meaning;
  } else if (qPhase === 2) {
    qMain = w.meaning;
    qSub = '';
    const choices = shuffle([w, ...others]);
    opts = choices.map(x => ({ text: x.word, correct: x.word === w.word }));
    correctText = w.word;
  } else {
    qMain = `"${w.word}"`;
    qSub = `${w.meaning} — 올바르게 쓰인 문장은?`;
    const choices = shuffle([w, ...others]);
    opts = choices.map(x => ({ text: x.example, correct: x.word === w.word }));
    correctText = w.example;
  }

  document.getElementById('quiz-q-main').textContent = qMain;
  document.getElementById('quiz-q-sub').textContent = qSub;

  const container = document.getElementById('quiz-opts');
  container.innerHTML = '';
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'quiz-opt';
    btn.textContent = opt.text;
    btn.dataset.correct = opt.correct;
    btn.dataset.correctText = correctText;
    btn.onclick = () => selectAnswer(btn, w.word);
    container.appendChild(btn);
  });
}

function selectAnswer(btn, word) {
  if (qAnswered) return;
  qAnswered = true;
  const isCorrect = btn.dataset.correct === 'true';
  const correctText = btn.dataset.correctText;
  document.querySelectorAll('.quiz-opt').forEach(b => {
    b.disabled = true;
    if (b.textContent === correctText) b.classList.add('correct');
  });
  const fb = document.getElementById('quiz-feedback');
  if (isCorrect) {
    fb.textContent = '✅ 정답!';
    fb.className = 'quiz-feedback ok';
    phaseScores[qPhase - 1]++;
  } else {
    btn.classList.add('wrong');
    fb.textContent = '❌ 오답';
    fb.className = 'quiz-feedback fail';
    wrongWords.add(word);
    markWrong5(word);
  }
  document.getElementById('btn-next-q').style.display = 'block';
}

function nextQuestion() {
  qIdx++;
  if (qIdx >= qWords.length) {
    showPhaseEnd();
    return;
  }
  renderQuestion();
}

function showPhaseEnd() {
  const score = phaseScores[qPhase - 1];
  const total = qWords.length;
  const isLast = qPhase === 3;

  const icons = ['📖', '✏️', '🖊️'];
  const nextLabels = ['2단계: 한국어 → 영어 시작', '3단계: 영작 퀴즈 시작', '결과 보기'];
  const descs = [
    '한국어 뜻을 보고 영어 단어를 맞혀보세요',
    '단어가 올바르게 쓰인 문장을 골라보세요',
    '퀴즈가 모두 끝났어요!'
  ];

  document.getElementById('phase-icon').textContent = icons[qPhase - 1];
  document.getElementById('phase-title').textContent = PHASES[qPhase - 1].title + ' 완료';
  document.getElementById('phase-desc').textContent = isLast ? descs[2] : descs[qPhase - 1];
  document.getElementById('phase-sc').textContent = `${score} / ${total}`;
  document.getElementById('phase-sl').textContent = Math.round(score / total * 100) + '% 정확도';
  document.getElementById('btn-next-phase').textContent = nextLabels[qPhase - 1];
  showScreen('screen-phase');
}

function nextPhase() {
  if (qPhase === 3) {
    showDone();
    return;
  }
  qPhase++;
  qWords = shuffle([...studyWords]);
  qIdx = 0;
  renderQuestion();
  showScreen('screen-quiz');
}

function showDone() {
  const total = phaseScores.reduce((a, b) => a + b, 0);
  const totalQ = qWords.length * 3;
  const pct = Math.round(total / totalQ * 100);
  const emoji = pct >= 90 ? '🏆' : pct >= 70 ? '🎉' : pct >= 50 ? '👍' : '💪';

  document.getElementById('done-emoji').textContent = emoji;
  document.getElementById('done-total').textContent = `${total} / ${totalQ}점`;

  const breakdown = document.getElementById('done-breakdown');
  breakdown.innerHTML = PHASES.map((p, i) => `
    <div class="phase-row">
      <span class="pl">${p.title}</span>
      <span class="pv">${phaseScores[i]} / ${qWords.length}</span>
    </div>`).join('');

  const wl = document.getElementById('wrong-list');
  if (wrongWords.size > 0) {
    wl.innerHTML = '<h3>틀린 단어 — 5일간 복습 예정</h3>' +
      [...wrongWords].map(word => {
        const w = ALL_WORDS.find(x => x.word === word);
        return w ? `<div class="wrong-item"><div class="ww">${w.word}</div><div class="wm">${w.meaning}</div></div>` : '';
      }).join('');
  }

  showScreen('screen-done');
}
</script>
